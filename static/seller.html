<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SahanaMart | Seller Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5f9;
            color: #333;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;

            width: 240px;
            height: 100vh;

            background: linear-gradient(
                180deg,
                #d63384,
                #b82d70
            );

            color: white;
            padding: 30px 20px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .seller-label {
            text-align: center;
            font-size: 13px;
            opacity: 0.85;
            margin-bottom: 40px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 12px;
        }

        .menu button {
            width: 100%;

            border: none;
            background: transparent;

            color: white;

            text-align: left;

            padding: 13px 15px;

            border-radius: 10px;

            cursor: pointer;

            font-size: 15px;
        }

        .menu button:hover,
        .menu button.active {
            background: rgba(
                255,
                255,
                255,
                0.18
            );
        }

        .logout {
            position: absolute;
            bottom: 30px;
            left: 20px;

            width: 200px;

            padding: 12px;

            border: 1px solid
                rgba(255,255,255,0.5);

            border-radius: 10px;

            background: transparent;

            color: white;

            cursor: pointer;

            font-weight: bold;
        }

        .logout:hover {
            background: white;
            color: #d63384;
        }


        /* MAIN */

        .main {
            margin-left: 240px;
            padding: 30px;
        }


        /* TOP BAR */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 30px;
        }

        .welcome h1 {
            color: #b82d70;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #888;
        }

        .profile {
            background: white;

            padding: 10px 18px;

            border-radius: 20px;

            color: #d63384;

            font-weight: bold;

            box-shadow:
                0 4px 15px
                rgba(214,51,132,0.1);
        }


        /* STAT CARDS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .stat-card {
            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(214,51,132,0.08);

            border-left: 5px solid #d63384;
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .stat-card h3 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #888;
            font-size: 14px;
        }


        /* PRODUCT SECTION */

        .section {
            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px
                rgba(214,51,132,0.08);
        }

        .section-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .section-header h2 {
            color: #b82d70;
        }

        .add-button {
            background: #d63384;

            color: white;

            border: none;

            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: bold;
        }

        .add-button:hover {
            background: #b82d70;
        }


        /* TABLE */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fff0f6;

            color: #b82d70;

            padding: 14px;

            text-align: left;
        }

        td {
            padding: 14px;

            border-bottom:
                1px solid #eee;
        }

        tr:hover {
            background: #fff8fb;
        }


        /* BUTTONS */

        .delete-btn {
            background: #dc3545;

            color: white;

            border: none;

            padding: 7px 12px;

            border-radius: 6px;

            cursor: pointer;
        }

        .delete-btn:hover {
            background: #b02a37;
        }


        /* MODAL */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.35);

            justify-content: center;

            align-items: center;
        }

        .modal-content {
            width: 420px;

            background: white;

            padding: 30px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0,0,0,0.2);
        }

        .modal-content h2 {
            color: #b82d70;

            margin-bottom: 20px;
        }

        .modal-content label {
            display: block;

            margin-bottom: 6px;

            font-weight: bold;
        }

        .modal-content input,
        .modal-content textarea {
            width: 100%;

            padding: 12px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 8px;
        }

        .modal-content textarea {
            height: 80px;

            resize: none;
        }

        .modal-buttons {
            display: flex;

            gap: 10px;
        }

        .save-btn {
            flex: 1;

            background: #d63384;

            color: white;

            border: none;

            padding: 12px;

            border-radius: 8px;

            cursor: pointer;
        }

        .cancel-btn {
            flex: 1;

            background: #eee;

            color: #555;

            border: none;

            padding: 12px;

            border-radius: 8px;

            cursor: pointer;
        }


        @media (max-width: 900px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
            }

            .stats {
                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<!-- SIDEBAR -->

<div class="sidebar">

    <div class="logo">
        SahanaMart
    </div>

    <div class="seller-label">
        SELLER PANEL
    </div>


    <ul class="menu">

        <li>
            <button class="active">
                🏠 Dashboard
            </button>
        </li>

        <li>
            <button onclick="loadProducts()">
                📦 My Products
            </button>
        </li>

        <li>
            <button>
                📊 Sales
            </button>
        </li>

        <li>
            <button>
                📦 Orders
            </button>
        </li>

    </ul>


    <button
        class="logout"
        onclick="logout()">

        🚪 Logout

    </button>

</div>



<!-- MAIN -->

<div class="main">


    <!-- TOPBAR -->

    <div class="topbar">

        <div class="welcome">

            <h1>
                Seller Dashboard
            </h1>

            <p>
                Manage your SahanaMart products 💗
            </p>

        </div>


        <div class="profile">
            🏪 Seller
        </div>

    </div>



    <!-- STATS -->

    <div class="stats">


        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <h3 id="productCount">
                0
            </h3>

            <p>
                My Products
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📊
            </div>

            <h3 id="totalStock">
                0
            </h3>

            <p>
                Total Stock
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <h3>
                ₹0
            </h3>

            <p>
                Total Sales
            </p>

        </div>

    </div>



    <!-- PRODUCTS -->

    <div class="section">


        <div class="section-header">

            <h2>
                My Products
            </h2>


            <button
                class="add-button"
                onclick="openModal()">

                + Add Product

            </button>

        </div>


        <table>

            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Description
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Stock
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>


            <tbody id="productTable">

                <tr>

                    <td
                        colspan="6"
                        style="text-align:center">

                        Loading products...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<!-- ADD PRODUCT MODAL -->

<div
    class="modal"
    id="productModal">


    <div class="modal-content">


        <h2>
            Add New Product
        </h2>


        <form
            id="productForm">


            <label>
                Product Name
            </label>

            <input
                type="text"
                id="productName"
                placeholder="Enter product name"
                required>


            <label>
                Description
            </label>

            <textarea
                id="productDescription"
                placeholder="Enter description">
            </textarea>


            <label>
                Price
            </label>

            <input
                type="number"
                id="productPrice"
                placeholder="Enter price"
                min="1"
                required>


            <label>
                Stock
            </label>

            <input
                type="number"
                id="productStock"
                placeholder="Enter stock"
                min="0"
                required>


            <div class="modal-buttons">

                <button
                    type="submit"
                    class="save-btn">

                    Add Product

                </button>


                <button
                    type="button"
                    class="cancel-btn"
                    onclick="closeModal()">

                    Cancel

                </button>

            </div>

        </form>

    </div>

</div>



<script>


// ============================
// LOAD PRODUCTS
// ============================

async function loadProducts() {

    try {

        const response =
            await fetch("/products");


        if (!response.ok) {

            throw new Error(
                "Unable to load products"
            );

        }


        const products =
            await response.json();


        document.getElementById(
            "productCount"
        ).textContent =
            products.length;


        let stock = 0;


        products.forEach(
            function(product) {

                stock +=
                    product.stock || 0;

            }
        );


        document.getElementById(
            "totalStock"
        ).textContent =
            stock;


        const table =
            document.getElementById(
                "productTable"
            );


        table.innerHTML = "";


        if (products.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        style="text-align:center">

                        No products found.

                    </td>

                </tr>

            `;

            return;

        }


        products.forEach(
            function(product) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${product.id}
                    </td>

                    <td>
                        <strong>
                            ${product.name}
                        </strong>
                    </td>

                    <td>
                        ${product.description || "-"}
                    </td>

                    <td>
                        ₹${product.price}
                    </td>

                    <td>
                        ${product.stock}
                    </td>

                    <td>

                        <button
                            class="delete-btn"
                            onclick="deleteProduct(${product.id})">

                            Delete

                        </button>

                    </td>

                `;


                table.appendChild(row);

            }
        );

    }

    catch (error) {

        console.error(error);

        document.getElementById(
            "productTable"
        ).innerHTML = `

            <tr>

                <td
                    colspan="6"
                    style="text-align:center;color:red">

                    Unable to load products.

                </td>

            </tr>

        `;

    }

}



// ============================
// OPEN MODAL
// ============================

function openModal() {

    document.getElementById(
        "productModal"
    ).style.display =
        "flex";

}



// ============================
// CLOSE MODAL
// ============================

function closeModal() {

    document.getElementById(
        "productModal"
    ).style.display =
        "none";

}



// ============================
// ADD PRODUCT
// ============================

document
    .getElementById("productForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const product = {

                name:
                    document.getElementById(
                        "productName"
                    ).value,

                description:
                    document.getElementById(
                        "productDescription"
                    ).value,

                price:
                    parseFloat(
                        document.getElementById(
                            "productPrice"
                        ).value
                    ),

                stock:
                    parseInt(
                        document.getElementById(
                            "productStock"
                        ).value
                    )

            };


            try {

                const response =
                    await fetch(
                        "/products",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(
                                    product
                                )
                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    alert(
                        data.detail ||
                        "Unable to add product."
                    );

                    return;

                }


                alert(
                    "Product added successfully! 💗"
                );


                document
                    .getElementById(
                        "productForm"
                    )
                    .reset();


                closeModal();

                loadProducts();

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to server."
                );

            }

        }
    );



// ============================
// DELETE PRODUCT
// ============================

async function deleteProduct(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this product?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `/products/${id}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.detail ||
                "Unable to delete product."
            );

            return;

        }


        alert(
            "Product deleted successfully."
        );


        loadProducts();

    }

    catch (error) {

        console.error(error);

        alert(
            "Unable to connect to server."
        );

    }

}



// ============================
// LOGOUT
// ============================

function logout() {

    localStorage.removeItem(
        "access_token"
    );

    localStorage.removeItem(
        "role"
    );


    window.location.href = "/";

}



// ============================
// START
// ============================

loadProducts();

</script>


</body>

</html>
