<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SahanaMart - Admin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #222;
            color: white;
            padding: 20px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
        }

        .logout {
            background: white;
            color: #222;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .welcome {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .actions {
            display: flex;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            flex: 1;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-top: 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>

<header>

    <h1>SahanaMart Admin</h1>

    <button class="logout" onclick="logout()">
        Logout
    </button>

</header>


<div class="container">

    <div class="welcome">

        <h2>Welcome, Admin 👋</h2>

        <p>
            Manage your SahanaMart products from this dashboard.
        </p>

    </div>


    <div class="actions">

        <div class="card">

            <h2>Products</h2>

            <p>
                View all products available in SahanaMart.
            </p>

            <button onclick="viewProducts()">
                View Products
            </button>

        </div>


        <div class="card">

            <h2>Add Product</h2>

            <p>
                Add a new product to the store.
            </p>

            <button onclick="addProduct()">
                Add Product
            </button>

        </div>

    </div>

</div>


<script>

    // Check whether user is logged in

    const token = localStorage.getItem("access_token");

    if (!token) {

        window.location.href = "/";

    }


    function viewProducts() {

        window.location.href = "/static/products.html";

    }


    function addProduct() {

        alert("Product creation will be available from the Product page.");

        window.location.href = "/static/products.html";

    }


    function logout() {

        localStorage.removeItem("access_token");

        localStorage.removeItem("role");

        window.location.href = "/";

    }

</script>

</body>
</html>
