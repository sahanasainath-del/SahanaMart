<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SahanaMart | Admin Dashboard</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5f9;
            color: #333;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 240px;
            height: 100vh;

            background: linear-gradient(
                180deg,
                #d63384,
                #b82d70
            );

            color: white;
            padding: 30px 20px;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .admin-label {
            text-align: center;
            font-size: 13px;
            opacity: 0.85;
            margin-bottom: 40px;
        }

        .menu {
            list-style: none;
        }

        .menu li {
            margin-bottom: 12px;
        }

        .menu button {
            width: 100%;
            border: none;
            background: transparent;
            color: white;
            text-align: left;
            padding: 13px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
        }

        .menu button:hover,
        .menu button.active {
            background: rgba(255, 255, 255, 0.18);
        }

        .logout {
            position: absolute;
            bottom: 30px;
            left: 20px;
            width: 200px;
            padding: 12px;

            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 10px;

            background: transparent;
            color: white;

            cursor: pointer;
            font-weight: bold;
        }

        .logout:hover {
            background: white;
            color: #d63384;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .main {
            margin-left: 240px;
            padding: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .welcome h1 {
            color: #b82d70;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #888;
        }

        .profile {
            background: white;
            padding: 10px 18px;
            border-radius: 20px;
            color: #d63384;
            font-weight: bold;

            box-shadow:
                0 4px 15px rgba(214, 51, 132, 0.1);
        }


        /* =========================
           STAT CARDS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(214, 51, 132, 0.08);

            border-left: 5px solid #d63384;
        }

        .stat-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .stat-card h3 {
            font-size: 28px;
            color: #333;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #888;
            font-size: 14px;
        }


        /* =========================
           PRODUCTS SECTION
        ========================= */

        .section {
            background: white;
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(214, 51, 132, 0.08);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 20px;
        }

        .section-header h2 {
            color: #b82d70;
        }

        .add-button {
            background: #d63384;
            color: white;

            border: none;
            padding: 11px 18px;

            border-radius: 8px;

            cursor: pointer;
            font-weight: bold;
        }

        .add-button:hover {
            background: #b82d70;
        }


        /* =========================
           TABLE
        ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fff0f6;
            color: #b82d70;
            padding: 14px;
            text-align: left;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #fff8fb;
        }

        .stock {
            color: #198754;
            font-weight: bold;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
            }

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

    </style>

</head>


<body>


<!-- =========================
     SIDEBAR
========================= -->

<div class="sidebar">

    <div class="logo">
        SahanaMart
    </div>

    <div class="admin-label">
        ADMIN PANEL
    </div>


    <ul class="menu">

        <li>
            <button class="active">
                🏠 Dashboard
            </button>
        </li>

        <li>
            <button onclick="showProducts()">
                📦 Products
            </button>
        </li>

        <li>
            <button>
                👥 Users
            </button>
        </li>

        <li>
            <button>
                🏪 Sellers
            </button>
        </li>

        <li>
            <button>
                📊 Reports
            </button>
        </li>

    </ul>


    <button class="logout" onclick="logout()">
        🚪 Logout
    </button>

</div>


<!-- =========================
     MAIN
========================= -->

<div class="main">


    <!-- TOP BAR -->

    <div class="topbar">

        <div class="welcome">

            <h1>
                Admin Dashboard
            </h1>

            <p>
                Welcome back, Admin! 👋
            </p>

        </div>


        <div class="profile">
            👑 Administrator
        </div>

    </div>



    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">


        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <h3 id="productCount">
                -
            </h3>

            <p>
                Total Products
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <h3>
                -
            </h3>

            <p>
                Total Users
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🏪
            </div>

            <h3>
                -
            </h3>

            <p>
                Total Sellers
            </p>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                💰
            </div>

            <h3>
                ₹0
            </h3>

            <p>
                Total Sales
            </p>

        </div>

    </div>



    <!-- =========================
         PRODUCTS
    ========================= -->

    <div class="section">

        <div class="section-header">

            <h2>
                Recent Products
            </h2>

            <button
                class="add-button"
                onclick="showProducts()">

                + Manage Products

            </button>

        </div>


        <table>

            <thead>

                <tr>

                    <th>
                        ID
                    </th>

                    <th>
                        Product
                    </th>

                    <th>
                        Description
                    </th>

                    <th>
                        Price
                    </th>

                    <th>
                        Stock
                    </th>

                </tr>

            </thead>


            <tbody id="productTable">

                <tr>

                    <td colspan="5"
                        style="text-align:center;">

                        Loading products...

                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>



<script>


// =========================
// LOAD PRODUCTS
// =========================

async function loadProducts() {

    try {

        const response =
            await fetch("/products");


        const products =
            await response.json();


        document.getElementById(
            "productCount"
        ).textContent =
            products.length;


        const table =
            document.getElementById(
                "productTable"
            );


        table.innerHTML = "";


        products.forEach(
            function(product) {

                const row =
                    document.createElement(
                        "tr"
                    );


                row.innerHTML = `

                    <td>
                        ${product.id}
                    </td>

                    <td>
                        <strong>
                            ${product.name}
                        </strong>
                    </td>

                    <td>
                        ${product.description || "-"}
                    </td>

                    <td>
                        ₹${product.price}
                    </td>

                    <td class="stock">
                        ${product.stock}
                    </td>

                `;


                table.appendChild(row);

            }
        );

    }

    catch (error) {

        console.error(
            "Unable to load products:",
            error
        );

    }

}



// =========================
// PRODUCTS PAGE
// =========================

function showProducts() {

    window.location.href =
        "/static/products.html";

}



// =========================
// LOGOUT
// =========================

function logout() {

    localStorage.removeItem(
        "access_token"
    );

    localStorage.removeItem(
        "role"
    );

    window.location.href =
        "/";

}



// =========================
// START
// =========================

loadProducts();


</script>


</body>

</html>
