<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SahanaMart - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
            color: #222;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>SahanaMart</h1>

        <p class="subtitle">
            Admin Login
        </p>

        <form id="loginForm">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="message"></p>

    </div>


    <script>

        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            const message = document.getElementById("message");

            try {

                const response = await fetch(
                    "http://127.0.0.1:8000/auth/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

                const data = await response.json();

                if (response.ok) {

                    localStorage.setItem(
                        "access_token",
                        data.access_token
                    );

                    localStorage.setItem(
                        "role",
                        data.role
                    );

                    message.textContent = "Login successful!";

                    setTimeout(function() {
                        window.location.href = "/static/admin.html";
                    }, 500);

                } else {

                    message.textContent =
                        data.detail || "Login failed.";

                }

            } catch (error) {

                message.textContent =
                    "Unable to connect to the server.";

                console.error(error);

            }

        });

    </script>

</body>
</html>
